{% extends 'base.html' %}

{% block title %}PDF to PowerPoint - Document Utility Suite{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="tool-header">
            <h1>PDF to PowerPoint</h1>
            <p>Convert your PDF pages into PowerPoint slides.</p>
        </div>

        <form action="/pdf-to-ppt" method="post" enctype="multipart/form-data">
            <div class="upload-area" id="dropZone">
                <input type="file" name="file" id="fileInput" accept=".pdf" style="display: none;">
                <div class="upload-icon">
                    <i class="fa-solid fa-file-powerpoint"></i>
                </div>
                <h3>Select PDF file</h3>
                <p>or drop PDF here</p>
                <button type="button" class="btn btn-primary btn-lg"
                    onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-folder-open"></i>
                    Select PDF file
                </button>
            </div>

            <div id="fileDisplay" style="display: none; margin-top: 2rem;">
                <div class="file-item" id="selectedFile"></div>
            </div>

            <div class="action-panel" id="actionPanel">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fa-solid fa-file-powerpoint"></i>
                    Convert to PowerPoint
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const actionPanel = document.getElementById('actionPanel');
    const fileDisplay = document.getElementById('fileDisplay');
    const selectedFile = document.getElementById('selectedFile');

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handleFile(e.target.files[0]);
        }
    });

    function handleFile(file) {
        if (file.type === 'application/pdf') {
            selectedFile.innerHTML = `
                <div class="file-item-info">
                    <div class="file-item-icon">
                        <i class="fa-solid fa-file-pdf"></i>
                    </div>
                    <div class="file-item-details">
                        <h4>${file.name}</h4>
                        <p>${(file.size / 1024 / 1024).toFixed(2)} MB • Ready to convert</p>
                    </div>
                </div>
                <div style="color: var(--success); font-size: 1.2rem;">
                    <i class="fa-solid fa-check-circle"></i>
                </div>
            `;
            fileDisplay.style.display = 'block';
            actionPanel.style.display = 'block';
            actionPanel.classList.add('show');
        } else {
            alert('Please select a PDF file.');
        }
    }
</script>
{% endblock %}

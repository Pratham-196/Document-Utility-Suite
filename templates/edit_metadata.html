{% extends 'base.html' %}

{% block title %}Edit PDF Metadata - Document Utility Suite{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <div class="tool-header">
            <h1>Edit PDF Metadata</h1>
            <p>Update PDF document properties like title, author, subject, and keywords.</p>
        </div>

        <form action="/edit-metadata" method="post" enctype="multipart/form-data">
            <div class="upload-area" id="dropZone">
                <input type="file" name="file" id="fileInput" accept=".pdf" style="display: none;">
                <div class="upload-icon">
                    <i class="fa-solid fa-file-pdf"></i>
                </div>
                <h3>Select PDF file</h3>
                <p>or drop PDF here</p>
                <button type="button" class="btn btn-primary btn-lg"
                    onclick="document.getElementById('fileInput').click()">
                    <i class="fa-solid fa-folder-open"></i>
                    Select PDF file
                </button>
            </div>

            <div id="metadataForm" style="display: none; margin-top: 2rem;">
                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" name="title" id="title" class="form-control" placeholder="Document Title">
                </div>

                <div class="form-group">
                    <label for="author">Author</label>
                    <input type="text" name="author" id="author" class="form-control" placeholder="Author Name">
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" name="subject" id="subject" class="form-control" placeholder="Document Subject">
                </div>

                <div class="form-group">
                    <label for="keywords">Keywords</label>
                    <input type="text" name="keywords" id="keywords" class="form-control" placeholder="keyword1, keyword2, keyword3">
                </div>

                <div class="action-panel show">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="fa-solid fa-save"></i>
                        Update Metadata
                    </button>
                </div>
            </div>
        </form>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const metadataForm = document.getElementById('metadataForm');

    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            fileInput.files = e.dataTransfer.files;
            handleFile();
        }
    });

    fileInput.addEventListener('change', handleFile);

    function handleFile() {
        if (fileInput.files.length && fileInput.files[0].type === 'application/pdf') {
            metadataForm.style.display = 'block';
            dropZone.style.opacity = '0.5';
        }
    }
</script>
{% endblock %}
